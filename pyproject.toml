[project]
name = "colony-counter"
version = "0.1.0"
description = "Count colonies and measure stained area from crystal-violet petri-dish images."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "hh65", email = "hh65@sussex.ac.uk" }
]
keywords = ["colony", "microscopy", "image-analysis", "crystal-violet", "petri-dish"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pillow>=10.0",
    "python-dotenv>=1.2.2",
    "scikit-image>=0.24",
    "scipy>=1.13",
]

[project.urls]
Homepage = "https://github.com/hh65/colony-counter"
Issues = "https://github.com/hh65/colony-counter/issues"

[project.scripts]
colony-counter = "colony_counter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "commitizen>=4.16.2",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
    "ty>=0.0.39",
]

# =========================
# Ty Configuration Section
# =========================

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "tests"]
exclude = [
    "**/.venv/",
    "**/venv/",
    "**/env/",
    "**/build/",
    "**/dist/",
    "**/migrations/",
]

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
# Mirrors mypy per-module `ignore_missing_imports` overrides.
replace-imports-with-any = [
    "some_untyped_package.**",
    "another_untyped_package.**",
]


# ===========================
# Ruff Configuration Section
# ===========================

[tool.ruff]
line-length = 79
lint.select = [
    "E", "F", "W", #flake8
    "UP", # pyupgrade
    "I", # isort
    "BLE", # flake8-blind-exception
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "C4", # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "G", # flake8-logging-format
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
lint.ignore = [
    "E501", # line too long. let black handle this
    "UP006", "UP007", # type annotation. As using magicgui require runtime type annotation then we disable this.
    "SIM117", # flake8-simplify - some of merged with statements are not looking great with black, reanble after drop python 3.9
    "ISC001", # string concatenation conflicts with formatter
]

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*vendored*",
    "*_vendor*",
]

fix = true


# ============================
# Pytest Configuration Section
# ============================

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
python_files = ["test_*.py"]


# ===========================
# Commitizen Configuration Section
# ===========================


[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_files = [
    "src/colony_counter/__init__.py:__version__",
    "pyproject.toml:version",
    "README.md:version-[0-9]+\\.[0-9]+\\.[0-9]+"
]
version_provider = "commitizen"
major_version_zero = true
bump_message = "bump: version $current_version → $new_version"
update_changelog_on_bump = true
annotated_tag = true
